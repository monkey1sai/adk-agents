version: '3.8'

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--detailed_debug" ]
    environment:
      # [Linux 模式] 指向同一個 Docker 網路內的 Ollama 服務
      OLLAMA_API_BASE: "http://ollama:11434/v1"
      
      OPENAI_API_KEY: "fake-key-for-ollama" 
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    restart: always

    # [資源優化] 針對 Linux 環境的記憶體與堆疊設定  
    shm_size: '32gb'
    # 記憶體鎖定與堆疊限制 (ulimits)
    ulimits:
      memlock: -1
      stack: 67108864

    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    environment:
      - OLLAMA_DEBUG=1
    
    # [GPU 加速]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]