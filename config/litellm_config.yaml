model_list:

  - model_name: ollama/qwen2.5
    litellm_params:
      # [突破點 4] 強制使用 OpenAI 協定：
      # 使用 "openai/" 前綴 (如 openai/qwen2.5:7b) 加上 api_base 指向 /v1。
      # 這會強迫 LiteLLM 以 OpenAI 格式 (而非 Ollama 原生格式) 轉發請求。
      # 這是解決 Tool Calling 格式錯誤 (Max turns exceeded) 的關鍵。
      model: openai/qwen2.5:7b
      
      # [突破點 5] 溫度控制：
      # 在這裡強制設為 0。小模型 (如 7B) 若溫度不為 0，
      # 容易在 Tool Calling 時產生幻覺或輸出錯誤的 JSON。
      temperature: 0

      # 方法 1. http://host.docker.internal:11434/v1 呼叫外部 Ollama 服務
      # api_base: http://host.docker.internal:11434/v1

      # 方法 2. 使用 Docker 網路內的 Ollama 服務
      # api_base: http://ollama:11434/v1 # ollama 代表containername, docker內部可以解析它, 指向 ollama 服務

      # 方法 3. LiteLLM 會自動去讀取 Docker 傳進來的 OLLAMA_API_BASE 值
      api_base: os.environ/OLLAMA_API_BASE
      api_key: ollama
  
  # 不支援 tool calling
  - model_name: ollama/gemma3
    litellm_params:
      model: openai/gemma3:4b
      temperature: 0
      api_base: os.environ/OLLAMA_API_BASE
      api_key: ollama

  # 比qwen2.5做RAG更好，回復更加精確不會胡扯, 但是中文能力極差
  - model_name: ollama/llama3.1
    litellm_params:
      model: openai/llama3.1:8b
      temperature: 0
      api_base: os.environ/OLLAMA_API_BASE
      api_key: ollama


  - model_name: ollama/qwen3
    litellm_params:
      model: openai/qwen3:8b
      temperature: 0
      api_base: os.environ/OLLAMA_API_BASE
      api_key: ollama
